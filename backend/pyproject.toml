[project]
name = "applyflow-global"
version = "0.1.0"
description = "ApplyFlow Global — Multi-user worldwide job discovery and email application platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "email-validator>=2.2.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "celery>=5.4.0",
  "redis>=5.2.0",
  "pwdlib[argon2]>=0.2.1",
  "cryptography>=44.0.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.20",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "beautifulsoup4>=4.12.3",
  "dnspython>=2.7.0",
  "pycountry>=24.6.1",
  "tzdata>=2024.2",
  "langdetect>=1.0.9",
  "openai>=1.58.0",
  "google-genai>=1.0.0",
  "tavily-python>=0.5.0",
  "boto3>=1.35.0",
]

[project.optional-dependencies]
browser = ["playwright==1.65.2"]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "fakeredis>=2.26.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008", "E501"]
