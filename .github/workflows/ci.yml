name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_SECRET_KEY: local-ci-fixture
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m pip install -r backend/requirements.lock
      - name: Python static checks
        run: |
          python -m ruff check backend scripts
          python -m ruff format --check scripts
      - run: python -m pytest -q
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Install browser test runtime
        run: |
          python -m pip install "playwright==1.65.2"
          python -m playwright install --with-deps chromium
      - run: npm run test:e2e
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Validate configuration and startup
        run: |
          python3 scripts/init_compose_env.py
          docker compose -p applyflow-ci --env-file .env -f deploy/docker-compose.yml config --quiet
          touch backend/private-build-probe.txt frontend/public/private-build-probe.txt
          docker compose -p applyflow-ci --env-file .env -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180
          docker compose -p applyflow-ci --env-file .env -f deploy/docker-compose.yml exec -T backend sh -ec 'test ! -e /app/private-build-probe.txt'
          docker compose -p applyflow-ci --env-file .env -f deploy/docker-compose.yml exec -T frontend sh -ec 'test ! -e /usr/share/nginx/html/private-build-probe.txt'
          curl -fsS http://localhost:8180/api/v1/health
          curl -fsS -o /dev/null http://localhost:8180/setup
      - name: Stop disposable stack
        if: always()
        run: docker compose -p applyflow-ci --env-file .env -f deploy/docker-compose.yml down


