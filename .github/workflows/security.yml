name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '21 4 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Scan checkout and reachable history
        run: |
          image=ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          docker run --rm --network none -v "$PWD:/repo:ro" "$image" dir /repo --redact=100
          docker run --rm --network none -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo:ro" "$image" git /repo --redact=100 --log-opts=--all
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.lock
      - run: npm audit --package-lock-only --ignore-scripts --audit-level=high
        working-directory: frontend
