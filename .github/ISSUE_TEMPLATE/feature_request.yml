name: Feature request
description: Propose an improvement to a candidate or operator workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you encounter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Who benefits and how?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Implementation suggestion
    validations:
      required: false
